services:
  couchdb:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=secret
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ../seed:/opt/couchdb/seed:ro
    ports:
      - "5984:5984"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5984/_up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - statusdb-network

  workspace:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    networks:
      - statusdb-network
    depends_on:
      couchdb:
        condition: service_healthy

volumes:
  couchdb-data:

networks:
  statusdb-network:
